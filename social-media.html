<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/DuckyFace.png">
<title>Social Media — Amira Elkady's Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>

/* =========================
   YOUR FONTS
========================= */

@font-face{
    font-family:"Goodfriend";
    src:url("Fonts/GoodFriend-R.ttf") format("truetype");
    font-display:swap;
}

@font-face{
    font-family:"CanvaCrayon";
    src:url("Fonts/Crayon.ttf") format("truetype");
    font-display:swap;
}

</style>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:"Segoe UI", sans-serif;

    background-image:url("images/backgroundimg.png");
    background-repeat:no-repeat;
    background-attachment:fixed;
    background-size:100% 100%;

}

body{

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-bottom:80px;

}

/* =========================
   HEADER IMAGE
========================= */

.commsHeader{

    width:45%;
    max-height:35vh;

    margin-top:0px;

    align-self:flex-start;

    object-fit:cover;
    display:block;

}

/* =========================
   CAROUSEL SECTION (top-level: picks which post)
========================= */

.carouselSection{

    position:relative;

    width:100%;
    max-width:900px;

    margin-top:0px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 90px;

}

.carouselTrack{

    position:relative;

    width:100%;
    height:320px;

}

.carouselItem{

    position:absolute;

    top:50%;
    left:50%;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;

    cursor:pointer;

    transition:
        left .5s cubic-bezier(.65,0,.35,1),
        transform .5s cubic-bezier(.65,0,.35,1),
        width .5s cubic-bezier(.65,0,.35,1),
        opacity .5s ease;

}

.carouselItem img{

    width:100%;
    aspect-ratio:4/3;

    object-fit:cover;

    border-radius:18px;

    box-shadow:0 12px 30px rgba(58,55,56,.18);

}

.carouselItem span{

    font-family:"Goodfriend", "Caveat", cursive;
    font-weight:600;

    color:#3a3738;

    text-align:center;

}

/* --- slot positions, assigned via JS --- */

.carouselItem[data-slot="center"]{

    left:50%;
    width:280px;

    transform:translate(-50%, -50%) scale(1);

    z-index:3;
    opacity:1;

}

.carouselItem[data-slot="center"] span{
    font-size:22px;
}

.carouselItem[data-slot="center"] img{
    outline:3px solid #b13b76;
    outline-offset:4px;
}

.carouselItem[data-slot="next"]{

    left:84%;
    width:170px;

    transform:translate(-50%, -50%) scale(1);

    z-index:2;
    opacity:.7;

}

.carouselItem[data-slot="prev"]{

    left:16%;
    width:170px;

    transform:translate(-50%, -50%) scale(1);

    z-index:2;
    opacity:.7;

}

.carouselItem[data-slot="next"] span,
.carouselItem[data-slot="prev"] span{
    font-size:16px;
}

.carouselItem[data-slot="hidden"]{

    left:50%;
    width:120px;

    transform:translate(-50%, -50%) scale(.5);

    z-index:1;
    opacity:0;

    pointer-events:none;

}

/* =========================
   CAROUSEL ARROWS (top-level post picker)
========================= */

.carouselArrow{

    position:absolute;
    top:50%;

    transform:translateY(-50%);

    background:none;
    border:none;

    cursor:pointer;

    padding:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:5;

}

.carouselArrow--left{ left:0; }
.carouselArrow--right{ right:0; }

.carouselArrow svg{

    width:34px;
    height:34px;

    animation:arrowGlow 2.2s ease-in-out infinite;

}

.carouselArrow--left svg{

    animation:
        arrowGlow 2.2s ease-in-out infinite,
        arrowNudgeLeft 2.2s ease-in-out infinite;

}

.carouselArrow--right svg{

    animation:
        arrowGlow 2.2s ease-in-out infinite,
        arrowNudgeRight 2.2s ease-in-out infinite;

}

.carouselArrow path{

    stroke:#565254;
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;

}

@keyframes arrowGlow{

    0%, 100%{
        filter:
            drop-shadow(0 0 2px #565254)
            drop-shadow(0 0 4px rgba(86,82,84,.4));
    }

    50%{
        filter:
            drop-shadow(0 0 8px #565254)
            drop-shadow(0 0 16px rgba(86,82,84,.7));
    }

}

@keyframes arrowNudgeLeft{

    0%, 100%{ transform:translateX(0); }
    50%{ transform:translateX(-6px); }

}

@keyframes arrowNudgeRight{

    0%, 100%{ transform:translateX(0); }
    50%{ transform:translateX(6px); }

}

@media (prefers-reduced-motion:reduce){

    .carouselArrow svg{ animation:none; }
    .carouselItem{ transition:none; }

}

/* =========================
   POST CONTENT PANEL
   Revealed underneath the top-level
   carousel when a post is clicked.
========================= */

.postContent{

    width:100%;
    max-width:760px;

    margin-top:56px;
    padding:0 24px;

    text-align:center;

    display:none;

}

.postContent.is-visible{

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:36px;

}

.postContent h2{

    font-family:"Goodfriend", "Caveat", cursive;
    font-weight:600;
    font-size:clamp(24px, 3.4vw, 34px);

    color:#3a3738;

}

.closeContent{

    align-self:center;

    background:none;
    border:1px solid #565254;
    border-radius:999px;

    width:36px;
    height:36px;

    font-size:18px;
    line-height:1;

    color:#565254;

    cursor:pointer;

    transition:background .25s ease, color .25s ease;

}

.closeContent:hover{

    background:#565254;
    color:#efedee;

}



   
.igBlock{

    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;

}

.igSectionLabel{

    font-family:"Goodfriend", "Caveat", cursive;
    font-weight:600;
    font-size:20px;

    color:#3a3738;

}

.igCarousel{

    position:relative;

    width:100%;
    max-width:420px;

    display:flex;
    align-items:center;
    justify-content:center;

}

.igCarouselFrame{

    position:relative;

    width:100%;
    max-height:70vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#e2dfe0;

    border-radius:16px;
    overflow:hidden;

    box-shadow:0 12px 30px rgba(58,55,56,.18);

}

.igCarouselImg{

    width:100%;
    max-height:70vh;

    object-fit:contain;

    display:block;

}

.igArrow{

    background:none;
    border:none;

    cursor:pointer;

    padding:6px;
    flex:0 0 auto;

    display:flex;
    align-items:center;
    justify-content:center;

}

.igArrow svg{

    width:24px;
    height:24px;

}

.igArrow path{

    stroke:#565254;
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;

}

.igArrow:disabled{

    opacity:.25;
    cursor:default;

}

/* =========================
   BACK TO PORTFOLIO
========================= */

.backToPortfolio{

    margin-top:64px;

    display:flex;
    flex-direction:row;
    align-items:center;
    gap:10px;

    text-decoration:none;

}

.backToPortfolio svg{

    width:26px;
    height:26px;

    animation:
        arrowGlow 2.2s ease-in-out infinite,
        arrowNudgeLeft 2.2s ease-in-out infinite;

}

.backToPortfolio path{

    stroke:#565254;
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;

}

.backToPortfolio span{

    font-family:"Goodfriend", "Caveat", cursive;
    font-weight:600;
    font-size:16px;

    color:#3a3738;

}

@media (prefers-reduced-motion:reduce){

    .backToPortfolio svg{ animation:none; }

}

</style>

</head>

<body>

    <!-- REPLACE WITH YOUR SOCIAL MEDIA HEADER IMAGE -->
    <img src="Graphics/SocialH1.png" class="commsHeader" alt="SocialMedia">

    <section class="carouselSection">

        <button class="carouselArrow carouselArrow--left" id="arrowLeft" aria-label="Previous post">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 4L7 12L15 20"/>
            </svg>
        </button>

        <div class="carouselTrack" id="carouselTrack">
       
        </div>

        <button class="carouselArrow carouselArrow--right" id="arrowRight" aria-label="Next post">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 4L17 12L9 20"/>
            </svg>
        </button>

    </section>

    <section class="postContent" id="postContent">

        <button class="closeContent" id="closeContent" aria-label="Close">×</button>

        <h2 id="postContentTitle"></h2>

        <div id="postContentBody"></div>

    </section>

    <a class="backToPortfolio" href="index.html#interestsPage">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 4L7 12L15 20"/>
        </svg>
        <span>Back to Portfolio</span>
    </a>



<script>

const posts = [
    {
        id:"dinerCarousel",
        title:"Instagram: Diner Carousel",
        thumb:"images/Dinerimg.png",
        type:"single",
        folder:"Social Media/Diner",
        count:4,
        ext:"jpg"
    },
    {
        id:"psychiatryCarousel",
        title:"Instagram: Psychiatry Clinic Carousel",
        thumb:"images/Nafsimage.png",
        type:"multi",
        sections:[
            { label:"Post 1", folder:"Social Media/Nafs/post1", count:7, ext:"png" },
            { label:"Post 2", folder:"Social Media/Nafs/post2", count:7, ext:"png" },
            { label:"Post 3", folder:"Social Media/Nafs/post3", count:10, ext:"png" }
        ]
    }
];

const track =
    document.getElementById("carouselTrack");

/* build one thumbnail element per post, once */

const itemEls = posts.map((post, index) => {

    const item = document.createElement("div");

    item.className = "carouselItem";
    item.dataset.index = index;
    item.tabIndex = 0;
    item.setAttribute("role", "button");
    item.setAttribute("aria-label", post.title);

    item.innerHTML = `
        <img src="${post.thumb}" alt="${post.title}">
        <span>${post.title}</span>
    `;

    item.addEventListener("click", () => selectPost(index));

    item.addEventListener("keydown", (e) => {

        if(e.key === "Enter" || e.key === " "){

            e.preventDefault();
            selectPost(index);

        }

    });

    track.appendChild(item);

    return item;

});

/* =========================
   TOP-LEVEL CAROUSEL STATE
========================= */

let currentIndex = 0;
let isNavigating = false;

const NAV_COOLDOWN = 550; // matches the CSS transition duration

const updateSlots = () => {

    const total = posts.length;

    itemEls.forEach((item, index) => {

        const relative = (index - currentIndex + total) % total;

        let slot = "hidden";

        if(relative === 0) slot = "center";
        else if(relative === 1) slot = "next";
        else if(relative === total - 1) slot = "prev";

        item.dataset.slot = slot;

    });

};

const goTo = (newIndex) => {

    if(isNavigating) return;

    isNavigating = true;

    currentIndex = (newIndex + posts.length) % posts.length;

    updateSlots();

    setTimeout(() => { isNavigating = false; }, NAV_COOLDOWN);

};

updateSlots();

/* =========================
   ARROW NAVIGATION (top-level)
========================= */

const arrowLeft =
    document.getElementById("arrowLeft");

const arrowRight =
    document.getElementById("arrowRight");

arrowLeft.addEventListener("mouseenter", () => goTo(currentIndex - 1));
arrowLeft.addEventListener("click", () => goTo(currentIndex - 1));
arrowLeft.addEventListener("focus", () => goTo(currentIndex - 1));

arrowRight.addEventListener("mouseenter", () => goTo(currentIndex + 1));
arrowRight.addEventListener("click", () => goTo(currentIndex + 1));
arrowRight.addEventListener("focus", () => goTo(currentIndex + 1));

/* =========================
   POST CONTENT PANEL
========================= */

const postContent =
    document.getElementById("postContent");

const postContentTitle =
    document.getElementById("postContentTitle");

const postContentBody =
    document.getElementById("postContentBody");

const closeContent =
    document.getElementById("closeContent");

const arrowSvg = (direction) => {

    const d = direction === "left" ? "M15 4L7 12L15 20" : "M9 4L17 12L9 20";

    return `
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="${d}"/>
        </svg>
    `;

};

/* Builds one Instagram-style sub-carousel: arrows + image + counter.
   folder/count define how many images (1.jpg .. count.jpg) to cycle through. */

function buildImageCarousel(folder, count, ext){

    const wrap = document.createElement("div");
    wrap.className = "igCarousel";

    let current = 1; // 1-indexed, matches file names

    wrap.innerHTML = `
        <button class="igArrow igArrowLeft" aria-label="Previous image">${arrowSvg("left")}</button>
        <div class="igCarouselFrame">
            <img class="igCarouselImg" src="${folder}/${current}.${ext}" alt="">
        </div>
        <button class="igArrow igArrowRight" aria-label="Next image">${arrowSvg("right")}</button>
    `;

    const img = wrap.querySelector(".igCarouselImg");
    const btnLeft = wrap.querySelector(".igArrowLeft");
    const btnRight = wrap.querySelector(".igArrowRight");

    const render = () => {

        img.src = `${folder}/${current}.${ext}`;

        btnLeft.disabled = current === 1;
        btnRight.disabled = current === count;

    };

    btnLeft.addEventListener("click", () => {
        if(current > 1){ current -= 1; render(); }
    });

    btnRight.addEventListener("click", () => {
        if(current < count){ current += 1; render(); }
    });

    render();

    return wrap;

}

function selectPost(index){

    goTo(index);

    const post = posts[index];

    postContentTitle.textContent = post.title;

    postContentBody.innerHTML = "";

    if(post.type === "single"){

        const block = document.createElement("div");
        block.className = "igBlock";

        block.appendChild(buildImageCarousel(post.folder, post.count, post.ext));

        postContentBody.appendChild(block);

    } else if(post.type === "multi"){

        post.sections.forEach((section) => {

            const block = document.createElement("div");
            block.className = "igBlock";

            const label = document.createElement("div");
            label.className = "igSectionLabel";
            label.textContent = section.label;

            block.appendChild(label);
            block.appendChild(buildImageCarousel(section.folder, section.count, section.ext));

            postContentBody.appendChild(block);

        });

    }

    postContent.classList.add("is-visible");

    postContent.scrollIntoView({ behavior:"smooth", block:"nearest" });

}

closeContent.addEventListener("click", () => {

    postContent.classList.remove("is-visible");

});

</script>

</body>
</html>
